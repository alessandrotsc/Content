<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
/* Content (EmpaMind): gleiches Kalenderblatt wie der Contentplaner, aber Nachtblau und Gold */
.grund{width:1024px;height:1024px;background:linear-gradient(158deg,#1C2A45 0%,#111C30 45%,#0A111D 100%);display:grid;place-items:center;position:relative}
.grund:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 20%, rgba(227,196,115,.22), transparent 58%)}
.blatt{position:relative;width:592px;height:560px;border-radius:96px;background:linear-gradient(180deg,#FBF5E8 0%,#EADFC6 100%);box-shadow:0 34px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.kopfband{height:150px;flex:none;background:linear-gradient(135deg,#E3C473,#B8913F)}
.punkte{flex:1;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:56px 76px 66px;gap:34px}
.punkt{width:112px;height:112px;border-radius:50%;background:#B9AE96;opacity:.5}
.punkt.an{background:linear-gradient(135deg,#1C2A45,#0A111D);opacity:1;box-shadow:0 12px 26px rgba(10,17,29,.45)}
.oese{position:absolute;top:-34px;width:64px;height:104px;border-radius:32px;background:linear-gradient(180deg,#FFF8E6,#D9C9A3)}
.oese.l{left:132px}.oese.r{right:132px}
</style></head><body><div class="grund"><div class="blatt"><div class="kopfband"></div>
<div class="punkte"><div class="punkt"></div><div class="punkt an"></div><div class="punkt"></div><div class="punkt"></div></div>
<div class="oese l"></div><div class="oese r"></div></div></div></body></html>
